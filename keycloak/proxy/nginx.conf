map $http_origin $account_cors_origin {
  default "";
  ~^http://(localhost|127\.0\.0\.1):5173$ $http_origin;
}

server {
  listen 80;
  server_name _;
  absolute_redirect off;
  resolver 127.0.0.11 valid=10s ipv6=off;
  set $keycloak_upstream keycloak:8080;

  location ~ ^/realms/events-realm/account/(applications|account-security/device-activity)(/|$) {
    return 302 /realms/events-realm/account/$is_args$args;
  }

  location = /realms/events-realm/account {
    if ($request_method = OPTIONS) {
      return 204;
    }

    proxy_pass http://$keycloak_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Host $http_host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_hide_header Access-Control-Allow-Origin;
    add_header Access-Control-Allow-Origin $account_cors_origin always;
    add_header Access-Control-Allow-Methods "GET, POST, OPTIONS" always;
    add_header Access-Control-Allow-Headers "Authorization, Content-Type, DPoP" always;
    add_header Access-Control-Max-Age 3600 always;
    add_header Vary Origin always;
  }

  location / {
    proxy_pass http://$keycloak_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Host $http_host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Real-IP $remote_addr;
  }
}
