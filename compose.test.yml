services:
  catalog-test-db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: catalog_test
      POSTGRES_USER: ${CAT_DB_USER:?CAT_DB_USER must be set}
      POSTGRES_PASSWORD: ${CAT_DB_PASSWORD:?CAT_DB_PASSWORD must be set}
    ports:
      - "5434:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d catalog_test"]
      interval: 2s
      timeout: 3s
      retries: 20
    restart: "no"

  catalog-test-s3:
    image: bitnamilegacy/minio:2024.12.18-debian-12-r0
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:?S3_ACCESS_KEY must be set}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:?S3_SECRET_KEY must be set}
    ports:
      - "9002:9000"
      - "9003:9001"
    tmpfs:
      - /data
    restart: "no"

  catalog-test-s3-init:
    image: bitnamilegacy/minio:2024.12.18-debian-12-r0
    entrypoint: ["/bin/sh", "-c"]
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:?S3_ACCESS_KEY must be set}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:?S3_SECRET_KEY must be set}
      S3_IMAGES_BUCKET: ${S3_IMAGES_BUCKET:-catalog-images}
    command:
      - |
        until mc alias set local http://catalog-test-s3:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD"; do sleep 1; done
        mc mb --ignore-existing "local/$$S3_IMAGES_BUCKET"
    depends_on:
      - catalog-test-s3
    restart: "no"
