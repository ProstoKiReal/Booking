services:
  catalog-service:
    &catalog-service
    build: ./backend/catalog-service
    restart: always
    volumes:
      - ./backend/catalog-service:/catalog-service
    working_dir: /catalog-service
    environment:
      - PYTHONPATH=src
      - CAT_DB_USER=${CAT_DB_USER}
      - CAT_DB_PASSWORD=${CAT_DB_PASSWORD}
      - CAT_DB_HOST=${CAT_DB_HOST}
      - CAT_DB_PORT=${CAT_DB_PORT}
      - CAT_DB_NAME=${CAT_DB_NAME}
      - CAT_APP_HOST=${CAT_APP_HOST}
      - CAT_APP_PORT=${CAT_APP_PORT}
      - CAT_APP_MODE=${CAT_APP_MODE}
      - S3_ACCESS_KEY=${S3_ACCESS_KEY}
      - S3_SECRET_KEY=${S3_SECRET_KEY}
      - S3_IMAGES_BUCKET=${S3_IMAGES_BUCKET}
      - S3_ENDPOINT_URL=http://minio:9000
      - S3_PUBLIC_URL=http://localhost:9000
      - S3_REGION=${S3_REGION}
      - S3_SIGNATURE_VERSION=${S3_SIGNATURE_VERSION}
      - S3_ADDRESSING_STYLE=${S3_ADDRESSING_STYLE}
    command: sh -c "alembic upgrade head  && uvicorn catalog_api.main:create_app --factory --host ${CAT_APP_HOST} --port ${CAT_APP_PORT} --reload"
    ports:
      - "${CAT_APP_PORT}:${CAT_APP_PORT}"
    depends_on:
      catalog-service-postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    networks:
      - app_net

  catalog-service-postgres:
    image: postgres:17-alpine
    volumes:
      - catalog-service-postgres-data:/var/lib/postgresql/data
    ports:
      - "${CAT_DB_HOST_PORT:-5433}:${CAT_DB_PORT}"
    environment:
      - POSTGRES_DB=${CAT_DB_NAME}
      - POSTGRES_USER=${CAT_DB_USER}
      - POSTGRES_PASSWORD=${CAT_DB_PASSWORD}
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${CAT_DB_USER} -d ${CAT_DB_NAME}" ]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - app_net
    restart: always

  minio:
    image: bitnamilegacy/minio:2024.12.18-debian-12-r0
    entrypoint: ["/bin/bash", "/scripts/minio-entrypoint.sh"]
    environment:
      - MINIO_ROOT_USER=${S3_ACCESS_KEY}
      - MINIO_ROOT_PASSWORD=${S3_SECRET_KEY}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-console-data:/bitnami/minio/data
      - ./scripts/minio-entrypoint.sh:/scripts/minio-entrypoint.sh:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "test -f /tmp/minio-initialized && curl -f http://localhost:9000/minio/health/ready"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - app_net

  keycloak:
    image: booking-keycloak:26.8
    build: ./keycloak
    container_name: keycloak
    command: start-dev --import-realm
    environment:
      - KC_DB=${KC_DB}
      - KC_DB_URL=${KC_DB_URL}
      - KC_DB_USERNAME=${KC_DB_USERNAME}
      - KC_DB_PASSWORD=${KC_DB_PASSWORD}
      - KEYCLOAK_ADMIN=${KEYCLOAK_ADMIN}
      - KEYCLOAK_ADMIN_PASSWORD=${KEYCLOAK_ADMIN_PASSWORD}
      - KC_HOSTNAME_STRICT=${KC_HOSTNAME_STRICT}
      - KC_HTTP_ENABLED=${KC_HTTP_ENABLED}
      - KC_PROXY_HEADERS=xforwarded
    volumes:
      - ./keycloak/realm-export.json:/opt/keycloak/data/import/realm-export.json:ro
      - ./keycloak/themes:/opt/keycloak/themes:ro
    depends_on:
      keycloak-postgres:
        condition: service_healthy
    networks:
      - app_net

  keycloak-proxy:
    image: nginx:alpine
    ports:
      - "8081:80"
    volumes:
      - ./keycloak/proxy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - keycloak
    networks:
      - app_net

  frontend:
    build:
      context: ./frontend
      args:
        VITE_KEYCLOAK_URL: ${VITE_KEYCLOAK_URL:-http://localhost:8081}
        VITE_GATEWAY_URL: ${VITE_GATEWAY_URL:-http://localhost:8080}
    ports:
      - "5173:80"
    depends_on:
      - keycloak-proxy
    networks:
      - app_net

  keycloak-postgres:
    image: postgres:17-alpine
    container_name: keycloak-postgres
    environment:
      - POSTGRES_DB=${KC_POSTGRES_DB}
      - POSTGRES_USER=${KC_POSTGRES_USER}
      - POSTGRES_PASSWORD=${KC_POSTGRES_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${KC_POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - keycloak-postgres-data:/var/lib/postgresql/data
    networks:
      - app_net

  krakend:
    image: devopsfaith/krakend:2.7
    container_name: krakend
    command: ["run", "-c", "/etc/krakend/krakend.json", "-d"]
    volumes:
      - ./krakend/krakend.json:/etc/krakend/krakend.json:ro
    ports:
      - "8080:8080"
    depends_on:
      - keycloak
      - catalog-service
    networks:
      - app_net


networks:
  app_net:
    driver: bridge

volumes:
  catalog-service-postgres-data:
  keycloak-postgres-data:
  minio-console-data:
